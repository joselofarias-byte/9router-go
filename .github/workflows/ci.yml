name: CI

on:
  push:
    branches: [main, integration/fabric-free-local-20260927, agent/llamacpp-local-20260928]
  pull_request:
    branches: [main, sync/upstream-2026-09-15]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build Web SPA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build
        run: go build -ldflags="-s -w" -o /tmp/9router-go ./cmd/9router-go/
