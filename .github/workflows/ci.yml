name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Race — Fabric and routing bridge
        run: go test -race ./internal/controlplane/... ./internal/handlers/chat/...

      - name: Build
        run: go build -ldflags="-s -w" -o /tmp/9router-go ./cmd/9router-go/

      - name: Build Termux Android arm64
        run: make build-termux
